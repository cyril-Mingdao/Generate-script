<!DOCTYPE html>
<!-- V27 -->

<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 台語劇本生成系統 (V27)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <style>
        :root {
            --primary-color: #2E7D32;
            --secondary-color: #f57c00;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --error-color: #d32f2f;
            --success-color: #388e3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            
            /* 全頁禁止選取文字 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 標題與設定按鈕區域 */
        .header-container {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0;
            display: inline-block;
        }
        .subtitle {
            margin: 5px 0 0 0;
            color: #555;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .settings-btn {
            position: absolute;
            right: 0;
            top: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .settings-btn:hover {
            text-shadow: 0 0 15px #ffd600, 0 0 25px #ffea00;
            filter: drop-shadow(0 0 5px #ffd600);
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        /* 狀態訊息顯示區 */
        #status-message {
            display: none;
            padding: 15px;
            margin-top: 15px; 
            margin-bottom: 0;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
        .status-error { background-color: #ffebee; color: var(--error-color); border: 1px solid var(--error-color); }
        .status-success { background-color: #e8f5e9; color: var(--success-color); border: 1px solid var(--success-color); }
        .status-loading { background-color: #e3f2fd; color: #0277bd; border: 1px solid #0277bd; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        
        /* 輸入框允許選取與編輯 */
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px; 
            box-sizing: border-box;
            
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; }
        textarea { resize: vertical; height: 100px; }
        
        /* 自訂模式選項區域 */
        #custom-mode-options {
            display: none;
            background-color: #f1f8e9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c5e1a5;
            margin-bottom: 15px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 14px;
        }
        .checkbox-item input {
            width: auto;
            margin-right: 5px;
        }
        .checkbox-item:hover {
            background-color: #e8f5e9;
            border-color: var(--primary-color);
        }
        /* 上傳劇本文字框樣式 */
        #upload-script-area {
            display: none;
            width: 100%;
            margin-top: 10px;
        }
        #uploadedScriptContent {
            height: 150px;
            border: 2px dashed #2E7D32;
            background-color: #f9fbe7;
            font-family: monospace;
        }

        #people-group {
            display: none;
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid var(--primary-color);
        }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1b5e20; }
        .btn:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        
        .btn-secondary {
            background-color: #0277bd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 15px;
        }
        .btn-secondary:hover { background-color: #01579b; }

        .example-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-example {
            background-color: #607d8b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 8px 12px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-example:hover { background-color: #455a64; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 25px;
            border-radius: 10px;
            border-top: 5px solid var(--secondary-color);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; color: var(--secondary-color); }
        .close-modal { font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-modal:hover { color: #000; }

        .advanced-toggle {
            cursor: pointer;
            color: #666;
            font-size: 0.9em;
            text-decoration: underline;
            margin-bottom: 10px;
            display: inline-block;
        }
        .advanced-toggle:hover { color: var(--secondary-color); }
        #advanced-options { display: none; margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 5px; }

        .output-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
            margin-top: 20px;
            position: relative;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-header h2 { margin: 0; color: #333; }
        
        .disclaimer-text {
            font-size: 0.65em;
            color: #888;
            font-weight: normal;
            margin-left: 10px;
        }

        .export-actions { display: flex; gap: 10px; }
        .export-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            text-decoration: none;
            color: #333;
        }
        .export-btn:hover { background-color: #f0f0f0; border-color: #999; }
        .word-btn { color: #2b579a; border-color: #2b579a; }
        .word-btn:hover { background-color: #e8f0fe; }
        .excel-btn { color: #217346; border-color: #217346; }
        .excel-btn:hover { background-color: #e6f4ea; }
        .copy-btn { color: #5f6368; border-color: #5f6368; }
        .copy-btn:hover { background-color: #f1f3f4; }

        #script-output {
            white-space: pre-wrap;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 200px;
            
            /* 輸出區允許選取 */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>AI 台語劇本生成系統 (V27)</h1>
        <p class="subtitle">台中明道中學 詹宗龍 製作</p>
        <button class="settings-btn" id="open-settings-btn" title="系統設定">⚙️ 設定</button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 系統設定</h2>
                <span class="close-modal" id="close-modal-x">&times;</span>
            </div>
            
            <div class="form-group">
                <label for="apiKey">🔑 Google Gemini API Key：</label>
                <input type="password" id="apiKey" placeholder="請輸入 API Key...">
                <small style="color: #666;">* 請輸入您的 Gemini API Key。</small>
            </div>

            <div class="form-group">
                <span class="advanced-toggle" id="toggle-advanced-btn">▼ 顯示/隱藏進階選項 (自訂 API URL)</span>
                <div id="advanced-options">
                    <label for="apiBaseUrl">🌐 API 基底 URL (預設為 Google 官方)：</label>
                    <input type="text" id="apiBaseUrl" placeholder="https://generativelanguage.googleapis.com">
                    <small style="color: #888;">* 除非您使用 Proxy 或特定節點，否則請保持空白。</small>
                </div>
            </div>

            <div class="form-group">
                <label for="modelSelect">🤖 選擇 AI 模型：</label>
                <select id="modelSelect">
                    <option value="gemini-3-flash-preview" selected>【順位1】Gemini 3 Flash Preview</option>
                    <option value="gemini-2.5-flash">【順位2】Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-flash-lite">【順位3】Gemini 2.5 Flash Lite</option>
                </select>
            </div>

            <div style="text-align: right; margin-top: 20px;">
                <a href="https://sites.google.com/ms.mingdao.edu.tw/tsiam/1/%E5%85%8D%E8%B2%BB%E7%94%B3%E8%AB%8Bapi" target="_blank" class="btn" style="background-color: #0277bd; width: auto; margin-right: 10px; display: inline-block; text-decoration: none; padding: 10px 15px; font-size: 14px;">🆓 免費申請API</a>
                <button type="button" class="btn" id="clear-key-btn" style="background-color: #d32f2f; width: auto; margin-right: 10px;">🗑️ 清除 API Key</button>
                <button type="button" class="btn" id="save-settings-btn" style="background-color: var(--secondary-color); width: auto;">💾 儲存設定並關閉</button>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="scriptForm">
            <div class="form-group">
                <label for="mode">🎭 競賽模式：</label>
                <select id="mode">
                    <option value="B">情境演說 (Speech)</option>
                    <option value="A">讀者劇場 (Reader's Theater)</option>
                </select>
            </div>

            <div class="form-group" id="people-group">
                <label for="people">👥 讀者劇場人數：</label>
                <select id="people">
                    <option value="4" selected>4 人</option>
                    <option value="1">1 人</option>
                    <option value="2">2 人</option>
                    <option value="3">3 人</option>
                    <option value="5">5 人</option>
                    <option value="6">6 人</option>
                    <option value="7">7 人</option>
                    <option value="8">8 人</option>
                </select>
            </div>

            <div class="form-group">
                <label for="level">🏫 參賽年段：</label>
                <select id="level">
                    <option value="J">國中組 (600字)</option>
                    <option value="S">高中組 (700字)</option>
                    <option value="Social">社會組 (1200字)</option>
                    <option value="Custom">★ 自訂模式 (可選主題、技能、字數)</option>
                </select>
            </div>

            <div id="custom-mode-options">
                <div class="form-group">
                    <label>📚 主題類型 (可複選)：</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="校園生活 (運動會、考試、下課時間)"> 校園生活</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="民間故事改編 (虎姑婆、蛇郎君、白賊七等)"> 民間故事改編</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="生活時事 (網紅現象、AI科技、食安問題)"> 生活時事</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="節慶與禮俗 (過年、端午、中元)"> 節慶與禮俗</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="在地特色 (介紹家鄉特產、景點)"> 在地特色</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>🚀 強化技能 (可複選)：</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="善用俗諺 (Sio̍k-gān):系統將自動置入如「一枝草一點露」等符合情境的諺語"> 善用俗諺</label>
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="押韻對句 (Ah-ūn):設計四句聯 (Sì-kù-liân) 或唸謠,增加節奏感"> 押韻對句</label>
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="趣味改編:將傳統故事結局翻轉 (例如:虎姑婆其實是吃菜的)"> 趣味改編</label>
                        <label class="checkbox-item" style="border-color: var(--secondary-color); background-color: #fff8e1;">
                            <input type="checkbox" name="customSkill" value="upload_script" id="uploadScriptCheckbox"> 📤 上傳劇本 (優化現有內容)
                        </label>
                    </div>
                    <div id="upload-script-area">
                        <textarea id="uploadedScriptContent" placeholder="請直接貼上內容,我將協助優化台語用字與分角"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <label for="customWordCount">✍️ 自訂字數：</label>
                    <input type="number" id="customWordCount" value="700" min="100" max="3000">
                </div>
            </div>

            <div class="form-group">
                <label for="pinyin">🔤 羅馬拼音 (Tâi-lô) 標註：</label>
                <select id="pinyin">
                    <option value="0" selected>否 (全漢字，適合程度較好的選手)</option>
                    <option value="1">是 (標註難詞拼音)</option>
                </select>
            </div>

            <hr>

            <div class="example-group">
                <button type="button" class="btn-example" id="btn-ex1">💡 範例 1 (貼心的囡仔)</button>
                <button type="button" class="btn-example" id="btn-ex2">💡 範例 2 (難忘的見笑代)</button>
            </div>

            <div class="form-group">
                <label for="topic">📝 題目 (必填)：</label>
                <input type="text" id="topic" placeholder="例如：阿媽的灶跤、手機仔的時代...">
            </div>

            <div class="form-group">
                <label for="outline">📖 故事大綱 (選填)：</label>
                <textarea id="outline" placeholder="請簡述故事大綱、角色性格或重點情節..."></textarea>
            </div>

            <button type="button" class="btn" id="generate-btn">🚀 立即生成劇本</button>
            
            <div id="status-message"></div>
        </form>
    </div>

    <div class="output-container" id="output-container">
        <div class="result-header">
            <h2>✨ 生成結果 <span class="disclaimer-text">(AI生成可能會出錯，仍需要你專業校稿)</span></h2>
            <div class="export-actions">
                <button class="export-btn word-btn" onclick="exportToWord()">
                    📥 匯出 Word
                </button>
                <button class="export-btn excel-btn" onclick="exportToExcel()">
                    📊 匯出 Excel
                </button>
                <button class="export-btn copy-btn" onclick="copyContent()">
                    📋 複製
                </button>
            </div>
        </div>
        <div id="script-output"></div>
    </div>

    <script>
        // DOM 元素
        const modeSelect = document.getElementById("mode");
        const peopleGroup = document.getElementById("people-group");
        const levelSelect = document.getElementById("level");
        const customModeOptions = document.getElementById("custom-mode-options");
        const uploadScriptCheckbox = document.getElementById("uploadScriptCheckbox");
        const uploadScriptArea = document.getElementById("upload-script-area");
        
        const statusMsg = document.getElementById("status-message");
        const generateBtn = document.getElementById("generate-btn");
        const modelSelect = document.getElementById("modelSelect");
        const outputContainer = document.getElementById("output-container");
        const scriptOutput = document.getElementById("script-output");
        
        const modal = document.getElementById("settings-modal");
        const openSettingsBtn = document.getElementById("open-settings-btn");
        const closeModalsX = document.getElementById("close-modal-x");
        const saveSettingsBtn = document.getElementById("save-settings-btn");
        const clearKeyBtn = document.getElementById("clear-key-btn");
        const apiKeyInput = document.getElementById("apiKey");
        
        const toggleAdvancedBtn = document.getElementById("toggle-advanced-btn");
        const advancedOptions = document.getElementById("advanced-options");
        const apiBaseUrlInput = document.getElementById("apiBaseUrl");

        const btnEx1 = document.getElementById("btn-ex1");
        const btnEx2 = document.getElementById("btn-ex2");

        let generatedContentRaw = "";

        // 防止右鍵與全選，但允許輸入框與輸出區操作
        document.addEventListener('contextmenu', function(e) {
            const target = e.target;
            const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT';
            const isOutput = target.closest('#script-output');
            
            if (!isInput && !isOutput) {
                e.preventDefault();
            }
        });

        function _load(u) {
            return (async () => {
                const res = await fetch(u);
                if (!res.ok) throw new Error(u);
                const b64 = (await res.text()).trim();
                return new TextDecoder('utf-8').decode(
                    Uint8Array.from(atob(b64), c => c.charCodeAt(0))
                );
            })();
        }
        let _r1 = null, _r2 = null;
        const _r1p = _load('res1.dat').then(v => _r1 = v);
        const _r2p = _load('res2.dat').then(v => _r2 = v);

        modeSelect.addEventListener("change", () => {
            peopleGroup.style.display = (modeSelect.value === "A") ? "block" : "none";
        });

        // UI 連動：自訂模式
        levelSelect.addEventListener("change", () => {
            if (levelSelect.value === "Custom") {
                customModeOptions.style.display = "block";
            } else {
                customModeOptions.style.display = "none";
            }
        });

        // UI 連動：上傳劇本選項
        uploadScriptCheckbox.addEventListener("change", () => {
            uploadScriptArea.style.display = uploadScriptCheckbox.checked ? "block" : "none";
        });

        // 範例按鈕事件
        btnEx1.addEventListener("click", () => {
            document.getElementById('topic').value = "貼心的囡仔";
            document.getElementById('outline').value = "拄起床的時，阿華看著𪜶阿母倒佇眠床頂，面色蓋成無啥爽快。阿母講伊今仔日規身軀攏無力，閣有小可仔發燒。這个時陣，阿華就隨提退燒藥仔來予阿母食，閣叫阿母好好仔歇睏，因為伊今仔日會用得家己行路去學校。";
        });

        btnEx2.addEventListener("click", () => {
            document.getElementById('topic').value = "難忘的見笑代";
            document.getElementById('outline').value = "因為昨昏看野球比賽看傷晏，所以今仔日就較晏起床。等我一下共目睭褫開，才發現差一點仔就欲遲到矣！這个時陣，我就緊共冊包揹咧，兇兇狂狂趕去學校。到校門，警衛才共我講今仔日是拜六，毋免上課。";
        });

        // 進階選項切換
        toggleAdvancedBtn.addEventListener("click", () => {
            if (advancedOptions.style.display === "block") {
                advancedOptions.style.display = "none";
                toggleAdvancedBtn.textContent = "▼ 顯示/隱藏進階選項 (自訂 API URL)";
            } else {
                advancedOptions.style.display = "block";
                toggleAdvancedBtn.textContent = "▲ 隱藏進階選項";
            }
        });

        function openModal() { modal.style.display = "block"; }
        function closeModal() { modal.style.display = "none"; }
        
        openSettingsBtn.onclick = openModal;
        closeModalsX.onclick = closeModal;
        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            const savedModel = localStorage.getItem('gemini_model');
            const savedBaseUrl = localStorage.getItem('gemini_base_url');
            
            if (savedKey) {
                apiKeyInput.value = savedKey;
                if (savedBaseUrl) apiBaseUrlInput.value = savedBaseUrl;
                
                // 如果有儲存的模型且在可選清單中，則選取它
                if (savedModel) {
                    const options = modelSelect.options;
                    for (let i = 0; i < options.length; i++) {
                        if (options[i].value === savedModel) {
                            modelSelect.selectedIndex = i;
                            break;
                        }
                    }
                }
            } else {
                openModal();
            }
        });

        saveSettingsBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const baseUrl = apiBaseUrlInput.value.trim();

            if (!key) { 
                showStatus("❌ 請輸入 API Key！", "error"); 
                return; 
            }
            
            localStorage.setItem('gemini_api_key', key);
            if (model) localStorage.setItem('gemini_model', model);
            
            if (baseUrl) localStorage.setItem('gemini_base_url', baseUrl);
            else localStorage.removeItem('gemini_base_url');

            closeModal();
            showStatus("✅ 設定已儲存", "success");
        });

        clearKeyBtn.addEventListener('click', () => {
            if (clearKeyBtn.innerText.includes("確定")) {
                localStorage.removeItem('gemini_api_key');
                localStorage.removeItem('gemini_model');
                localStorage.removeItem('gemini_base_url');
                apiKeyInput.value = "";
                apiBaseUrlInput.value = "";
                modelSelect.selectedIndex = 0; // 重置為順位1
                showStatus("🗑️ 所有設定已清除", "success");
                clearKeyBtn.innerText = "🗑️ 清除 API Key";
                clearKeyBtn.style.backgroundColor = "#d32f2f";
            } else {
                clearKeyBtn.innerText = "🗑️ 確定清除？";
                clearKeyBtn.style.backgroundColor = "#b71c1c";
                setTimeout(() => {
                    clearKeyBtn.innerText = "🗑️ 清除 API Key";
                    clearKeyBtn.style.backgroundColor = "#d32f2f";
                }, 3000);
            }
        });

        function showStatus(message, type) {
            statusMsg.style.display = "block";
            statusMsg.textContent = message;
            statusMsg.className = ""; 
            if (type === "error") statusMsg.classList.add("status-error");
            else if (type === "success") statusMsg.classList.add("status-success");
            else statusMsg.classList.add("status-loading");
            
            if (type !== "loading" && modal.style.display === "none") {
                statusMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 複製功能 (修改版)
        window.copyContent = function() {
            if (!generatedContentRaw) { showStatus("❌ 無內容可複製", "error"); return; }
            
            navigator.clipboard.writeText(generatedContentRaw).then(() => {
                showStatus("✅ 已複製到剪貼簿", "success");
                
                // 按鈕回饋
                const copyBtn = document.querySelector('.copy-btn');
                if(copyBtn) {
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = "✅ 已複製";
                    copyBtn.style.backgroundColor = "#e8f5e9";
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = "📋 複製";
                        copyBtn.style.backgroundColor = ""; 
                    }, 3000);
                }
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showStatus("❌ 複製失敗", "error");
            });
        };

        // 生成按鈕邏輯
        generateBtn.addEventListener("click", async () => {
            if (!_r1 || !_r2) {
                showStatus("⏳ 系統初始化中，請稍候再試一次...", "loading");
                try {
                    await Promise.all([_r1p, _r2p]);
                } catch (e) {
                    showStatus("❌ 系統資源載入失敗，請重新整理頁面再試一次。", "error");
                    return;
                }
            }

            const apiKey = apiKeyInput.value.trim();
            const modelName = modelSelect.value;
            const topic = document.getElementById('topic').value.trim();

            if (!apiKey) {
                showStatus("❌ 未偵測到 API Key，請點擊右上角「設定」進行輸入。", "error");
                openModal();
                return;
            }
            if (!modelName || modelName === "") {
                showStatus("❌ 未選擇模型，請至設定中偵測並儲存。", "error");
                openModal();
                return;
            }
            if (!topic) {
                showStatus("❌ 請填寫劇本題目", "error");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = "⏳ 劇本生成中 (若遇忙碌將自動重試)...";
            outputContainer.style.display = "none";
            showStatus(`正在使用模型 [${modelName}] 生成劇本...`, "loading");

            // 參數處理
            const mode = modeSelect.value;
            const level = document.getElementById('level').value; 
            const pinyin = document.getElementById('pinyin').value;
            const people = document.getElementById('people').value;
            const outline = document.getElementById('outline').value.trim();

            const modeText = mode === "A" ? `讀者劇場 (${people}人)` : "情境演說 (1人)";
            
            // 年段與自訂模式邏輯處理
            let levelPrompt = "";
            let wordCountPrompt = "";
            
            if (level === "J") {
                levelPrompt = "年段：國中組";
                wordCountPrompt = "字數：約 600 字";
            } else if (level === "S") {
                levelPrompt = "年段：高中組";
                wordCountPrompt = "字數：約 700 字";
            } else if (level === "Social") {
                levelPrompt = "年段：社會組\n【社會組特別規範】：\n1. 必須加入「押韻對句 (Ah-ūn)」：設計四句聯 (Sì-kù-liân) 或唸謠，增加節奏感與音韻之美。\n2. 內容深度需符合成人社會經驗。";
                wordCountPrompt = "字數：約 1200 字";
            } else if (level === "Custom") {
                // 自訂模式處理
                const customThemes = Array.from(document.querySelectorAll('input[name="customTheme"]:checked')).map(cb => cb.value).join(", ");
                const customSkills = Array.from(document.querySelectorAll('input[name="customSkill"]:checked')).map(cb => cb.value).join(", ");
                const customWordCount = document.getElementById('customWordCount').value;
                
                levelPrompt = `年段：自訂模式\n【自訂模式需求】：\n1. 主題類型請側重於：${customThemes || "未指定，請自由發揮"}\n2. 請特別強化以下技能：${customSkills || "無特殊指定"}`;
                wordCountPrompt = `字數：約 ${customWordCount} 字`;
            }
            
            let pinyinPrompt = pinyin === "1" 
                ? "【拼音規範：嚴格使用「教育部臺灣台語羅馬字拼音方案 (Tâi-lô)」，絕對禁止使用白話字 (POJ)。針對難詞進行標註。】" 
                : "【拼音規範：全漢字，不需標註拼音。】";

            let characterPrompt = "";
            if (mode === "A") {
                characterPrompt = `【智慧角色擴充指令】：
目前設定是「讀者劇場 ${people}人」。
若「故事大綱」角色少於 ${people} 人，請務必自動增加合理的角色(如：阿爸、阿姊、老師、口白等) 以補足 ${people} 位。
請在角色列表中明確列出這 ${people} 位角色。`;
            }

            // 上傳劇本處理邏輯
            let contentPrompt = "";
            const isUploadScript = document.getElementById('uploadScriptCheckbox')?.checked;
            const uploadedContent = document.getElementById('uploadedScriptContent')?.value.trim();

            if (isUploadScript && uploadedContent) {
                contentPrompt = `【使用者上傳之原始劇本/文本】：\n${uploadedContent}\n\n【任務指示】：請以使用者提供的上述內容為核心，進行台語正字優化與${modeText}格式改編。請保留原意，重點在於修正錯誤用字、加強語氣與分角。`;
            } else {
                contentPrompt = `故事大綱：${outline ? outline : "無特定大綱，請自由發揮，需符合該年段生活經驗。"}`;
            }

            // 組合最終 Prompt
            const peopleLabel = mode === "A" ? (people + "位") : "1位";
            const prompt = _r2
                .split('%%R1%%').join(_r1)
                .split('%%MODE_TEXT%%').join(modeText)
                .split('%%LEVEL_PROMPT%%').join(levelPrompt)
                .split('%%WORD_COUNT_PROMPT%%').join(wordCountPrompt)
                .split('%%PINYIN_PROMPT%%').join(pinyinPrompt)
                .split('%%TOPIC%%').join(topic)
                .split('%%CONTENT_PROMPT%%').join(contentPrompt)
                .split('%%CHARACTER_PROMPT%%').join(characterPrompt)
                .split('%%PEOPLE_LABEL%%').join(peopleLabel);

            const baseUrl = apiBaseUrlInput.value.trim() || "https://generativelanguage.googleapis.com";
            const url = `${baseUrl}/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

            async function fetchWithRetry(url, payload, retries = 3) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            const errText = await response.text();
                            if (response.status === 503 && i < retries - 1) {
                                showStatus(`⚠️ 伺服器忙碌中 (503)，正在進行第 ${i + 1} 次自動重試...`, "loading");
                                await new Promise(r => setTimeout(r, 2000 * (i + 1))); 
                                continue;
                            }
                            throw new Error(`API 錯誤 (${response.status}): ${errText}`);
                        }
                        return await response.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                    }
                }
            }

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.7 }
                };

                const data = await fetchWithRetry(url, payload);
                
                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error("API 回傳格式異常或被安全過濾攔截。");
                }
                
                const text = data.candidates[0].content.parts[0].text;
                generatedContentRaw = text; 

                let htmlText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                htmlText = htmlText.replace(/## (.*?)\n/g, '<h3>$1</h3>');
                htmlText = htmlText.replace(/\n/g, '<br>');

                scriptOutput.innerHTML = htmlText;
                outputContainer.style.display = "block";
                showStatus("✅ 劇本生成成功！", "success");
                outputContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error(error);
                let errorMsg = error.message;
                if (errorMsg.includes("404")) errorMsg = "找不到模型 (404) 或 API URL 錯誤。";
                showStatus(`❌ 生成失敗：${errorMsg}`, "error");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = "🚀 立即生成劇本";
            }
        });

        function getFilename(extension) {
            const topic = document.getElementById('topic').value.trim();
            const safeTopic = topic.replace(/[\\/:*?"<>|]/g, "_");
            return safeTopic ? `${safeTopic}.${extension}` : `台語劇本.${extension}`;
        }

        window.exportToWord = function() {
            if (!generatedContentRaw) { showStatus("❌ 無內容可匯出", "error"); return; }
            const content = generatedContentRaw.replace(/\n/g, "<br>");
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export</title></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = getFilename("doc");
            fileDownload.click();
            document.body.removeChild(fileDownload);
        };

        window.exportToExcel = function() {
            if (!generatedContentRaw) { showStatus("❌ 無內容可匯出", "error"); return; }
            let tableContent = "<table>";
            const lines = generatedContentRaw.split('\n');
            lines.forEach(line => {
                if(line.includes('：') || line.includes(':')) {
                    const parts = line.split(/[:：]/, 2);
                    tableContent += `<tr><td>${parts[0]}</td><td>${parts[1] || ''}</td></tr>`;
                } else {
                    tableContent += `<tr><td>${line}</td><td></td></tr>`;
                }
            });
            tableContent += "</table>";
            const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>' + tableContent + '</body></html>';
            const blob = new Blob([template], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = getFilename("xls");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
