<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 台語劇本生成系統 (v18.0)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <style>
        :root {
            --primary-color: #2E7D32;
            --secondary-color: #f57c00;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --error-color: #d32f2f;
            --success-color: #388e3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            
            /* 全頁禁止選取文字 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 標題與設定按鈕區域 */
        .header-container {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0;
            display: inline-block;
        }
        .subtitle {
            margin: 5px 0 0 0;
            color: #555;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .settings-btn {
            position: absolute;
            right: 0;
            top: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .settings-btn:hover {
            text-shadow: 0 0 15px #ffd600, 0 0 25px #ffea00;
            filter: drop-shadow(0 0 5px #ffd600);
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        /* 狀態訊息顯示區 */
        #status-message {
            display: none;
            padding: 15px;
            margin-top: 15px; 
            margin-bottom: 0;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
        .status-error { background-color: #ffebee; color: var(--error-color); border: 1px solid var(--error-color); }
        .status-success { background-color: #e8f5e9; color: var(--success-color); border: 1px solid var(--success-color); }
        .status-loading { background-color: #e3f2fd; color: #0277bd; border: 1px solid #0277bd; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        
        /* 輸入框允許選取與編輯 */
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px; 
            box-sizing: border-box;
            
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; }
        textarea { resize: vertical; height: 100px; }
        
        /* 自訂模式選項區域 */
        #custom-mode-options {
            display: none;
            background-color: #f1f8e9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c5e1a5;
            margin-bottom: 15px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 14px;
        }
        .checkbox-item input {
            width: auto;
            margin-right: 5px;
        }
        .checkbox-item:hover {
            background-color: #e8f5e9;
            border-color: var(--primary-color);
        }
        /* 上傳劇本文字框樣式 */
        #upload-script-area {
            display: none;
            width: 100%;
            margin-top: 10px;
        }
        #uploadedScriptContent {
            height: 150px;
            border: 2px dashed #2E7D32;
            background-color: #f9fbe7;
            font-family: monospace;
        }

        #people-group {
            display: none;
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid var(--primary-color);
        }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1b5e20; }
        .btn:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        
        .btn-secondary {
            background-color: #0277bd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 15px;
        }
        .btn-secondary:hover { background-color: #01579b; }

        .example-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-example {
            background-color: #607d8b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 8px 12px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-example:hover { background-color: #455a64; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 25px;
            border-radius: 10px;
            border-top: 5px solid var(--secondary-color);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; color: var(--secondary-color); }
        .close-modal { font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-modal:hover { color: #000; }

        .advanced-toggle {
            cursor: pointer;
            color: #666;
            font-size: 0.9em;
            text-decoration: underline;
            margin-bottom: 10px;
            display: inline-block;
        }
        .advanced-toggle:hover { color: var(--secondary-color); }
        #advanced-options { display: none; margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 5px; }

        .output-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
            margin-top: 20px;
            position: relative;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-header h2 { margin: 0; color: #333; }
        
        .disclaimer-text {
            font-size: 0.65em;
            color: #888;
            font-weight: normal;
            margin-left: 10px;
        }

        .export-actions { display: flex; gap: 10px; }
        .export-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            text-decoration: none;
            color: #333;
        }
        .export-btn:hover { background-color: #f0f0f0; border-color: #999; }
        .word-btn { color: #2b579a; border-color: #2b579a; }
        .word-btn:hover { background-color: #e8f0fe; }
        .excel-btn { color: #217346; border-color: #217346; }
        .excel-btn:hover { background-color: #e6f4ea; }
        .copy-btn { color: #5f6368; border-color: #5f6368; }
        .copy-btn:hover { background-color: #f1f3f4; }

        #script-output {
            white-space: pre-wrap;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 200px;
            
            /* 輸出區允許選取 */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>AI 台語劇本生成系統 (v18.0)</h1>
        <p class="subtitle">台中明道中學 詹宗龍 製作</p>
        <button class="settings-btn" id="open-settings-btn" title="系統設定">⚙️ 設定</button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 系統設定</h2>
                <span class="close-modal" id="close-modal-x">&times;</span>
            </div>
            
            <div class="form-group">
                <label for="apiKey">🔑 Google Gemini API Key：</label>
                <div class="input-group">
                    <input type="password" id="apiKey" placeholder="請輸入 API Key...">
                    <button type="button" class="btn-secondary" id="load-models-btn" style="white-space: nowrap;">🔄 偵測可用模型</button>
                </div>
                <small style="color: #666;">* 輸入 Key 後請點擊偵測，確認模型可用性。</small>
            </div>

            <div class="form-group">
                <span class="advanced-toggle" id="toggle-advanced-btn">▼ 顯示/隱藏進階選項 (自訂 API URL)</span>
                <div id="advanced-options">
                    <label for="apiBaseUrl">🌐 API 基底 URL (預設為 Google 官方)：</label>
                    <input type="text" id="apiBaseUrl" placeholder="https://generativelanguage.googleapis.com">
                    <small style="color: #888;">* 除非您使用 Proxy 或特定節點，否則請保持空白。</small>
                </div>
            </div>

            <div class="form-group">
                <label for="modelSelect">🤖 選擇 AI 模型：</label>
                <select id="modelSelect">
                    <option value="">請先輸入 API Key 並點擊「偵測可用模型」</option>
                </select>
            </div>

            <div style="text-align: right; margin-top: 20px;">
                <button type="button" class="btn" id="clear-key-btn" style="background-color: #d32f2f; width: auto; margin-right: 10px;">🗑️ 清除 API Key</button>
                <button type="button" class="btn" id="save-settings-btn" style="background-color: var(--secondary-color); width: auto;">💾 儲存設定並關閉</button>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="scriptForm">
            <div class="form-group">
                <label for="mode">🎭 競賽模式：</label>
                <select id="mode">
                    <option value="B">情境演說 (Speech)</option>
                    <option value="A">讀者劇場 (Reader's Theater)</option>
                </select>
            </div>

            <div class="form-group" id="people-group">
                <label for="people">👥 讀者劇場人數：</label>
                <select id="people">
                    <option value="4" selected>4 人</option>
                    <option value="1">1 人</option>
                    <option value="2">2 人</option>
                    <option value="3">3 人</option>
                    <option value="5">5 人</option>
                    <option value="6">6 人</option>
                    <option value="7">7 人</option>
                    <option value="8">8 人</option>
                </select>
            </div>

            <div class="form-group">
                <label for="level">🏫 參賽年段：</label>
                <select id="level">
                    <option value="J">國中組 (600字)</option>
                    <option value="S">高中組 (700字)</option>
                    <option value="Social">社會組 (1200字)</option>
                    <option value="Custom">★ 自訂模式 (可選主題、技能、字數)</option>
                </select>
            </div>

            <div id="custom-mode-options">
                <div class="form-group">
                    <label>📚 主題類型 (可複選)：</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="校園生活 (運動會、考試、下課時間)"> 校園生活</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="民間故事改編 (虎姑婆、蛇郎君、白賊七等)"> 民間故事改編</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="生活時事 (網紅現象、AI科技、食安問題)"> 生活時事</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="節慶與禮俗 (過年、端午、中元)"> 節慶與禮俗</label>
                        <label class="checkbox-item"><input type="checkbox" name="customTheme" value="在地特色 (介紹家鄉特產、景點)"> 在地特色</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>🚀 強化技能 (可複選)：</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="善用俗諺 (Sio̍k-gān):系統將自動置入如「一枝草一點露」等符合情境的諺語"> 善用俗諺</label>
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="押韻對句 (Ah-ūn):設計四句聯 (Sì-kù-liân) 或唸謠,增加節奏感"> 押韻對句</label>
                        <label class="checkbox-item"><input type="checkbox" name="customSkill" value="趣味改編:將傳統故事結局翻轉 (例如:虎姑婆其實是吃菜的)"> 趣味改編</label>
                        <label class="checkbox-item" style="border-color: var(--secondary-color); background-color: #fff8e1;">
                            <input type="checkbox" name="customSkill" value="upload_script" id="uploadScriptCheckbox"> 📤 上傳劇本 (優化現有內容)
                        </label>
                    </div>
                    <div id="upload-script-area">
                        <textarea id="uploadedScriptContent" placeholder="請直接貼上內容,我將協助優化台語用字與分角"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <label for="customWordCount">✍️ 自訂字數：</label>
                    <input type="number" id="customWordCount" value="700" min="100" max="3000">
                </div>
            </div>

            <div class="form-group">
                <label for="pinyin">🔤 羅馬拼音 (Tâi-lô) 標註：</label>
                <select id="pinyin">
                    <option value="0" selected>否 (全漢字，適合程度較好的選手)</option>
                    <option value="1">是 (標註難詞拼音)</option>
                </select>
            </div>

            <hr>

            <div class="example-group">
                <button type="button" class="btn-example" id="btn-ex1">💡 範例 1 (貼心的囡仔)</button>
                <button type="button" class="btn-example" id="btn-ex2">💡 範例 2 (難忘的見笑代)</button>
            </div>

            <div class="form-group">
                <label for="topic">📝 題目 (必填)：</label>
                <input type="text" id="topic" placeholder="例如：阿媽的灶跤、手機仔的時代...">
            </div>

            <div class="form-group">
                <label for="outline">📖 故事大綱 (選填)：</label>
                <textarea id="outline" placeholder="請簡述故事大綱、角色性格或重點情節..."></textarea>
            </div>

            <button type="button" class="btn" id="generate-btn">🚀 立即生成劇本</button>
            
            <div id="status-message"></div>
        </form>
    </div>

    <div class="output-container" id="output-container">
        <div class="result-header">
            <h2>✨ 生成結果 <span class="disclaimer-text">(AI生成可能會出錯，仍需要你專業校稿)</span></h2>
            <div class="export-actions">
                <button class="export-btn word-btn" onclick="exportToWord()">
                    📥 匯出 Word
                </button>
                <button class="export-btn excel-btn" onclick="exportToExcel()">
                    📊 匯出 Excel
                </button>
                <button class="export-btn copy-btn" onclick="copyContent()">
                    📋 複製
                </button>
            </div>
        </div>
        <div id="script-output"></div>
    </div>

    <script>
        // DOM 元素
        const modeSelect = document.getElementById("mode");
        const peopleGroup = document.getElementById("people-group");
        const levelSelect = document.getElementById("level");
        const customModeOptions = document.getElementById("custom-mode-options");
        const uploadScriptCheckbox = document.getElementById("uploadScriptCheckbox");
        const uploadScriptArea = document.getElementById("upload-script-area");
        
        const statusMsg = document.getElementById("status-message");
        const generateBtn = document.getElementById("generate-btn");
        const loadModelsBtn = document.getElementById("load-models-btn");
        const modelSelect = document.getElementById("modelSelect");
        const outputContainer = document.getElementById("output-container");
        const scriptOutput = document.getElementById("script-output");
        
        const modal = document.getElementById("settings-modal");
        const openSettingsBtn = document.getElementById("open-settings-btn");
        const closeModalsX = document.getElementById("close-modal-x");
        const saveSettingsBtn = document.getElementById("save-settings-btn");
        const clearKeyBtn = document.getElementById("clear-key-btn");
        const apiKeyInput = document.getElementById("apiKey");
        
        const toggleAdvancedBtn = document.getElementById("toggle-advanced-btn");
        const advancedOptions = document.getElementById("advanced-options");
        const apiBaseUrlInput = document.getElementById("apiBaseUrl");

        const btnEx1 = document.getElementById("btn-ex1");
        const btnEx2 = document.getElementById("btn-ex2");

        let generatedContentRaw = "";

        // 防止右鍵與全選，但允許輸入框與輸出區操作
        document.addEventListener('contextmenu', function(e) {
            const target = e.target;
            const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT';
            const isOutput = target.closest('#script-output');
            
            if (!isInput && !isOutput) {
                e.preventDefault();
            }
        });

        // 完整俗諺資料庫
        const proverbDb = `
1. 鴨仔聽雷 (Ah-á thiann luî) - 比喻一個人對所接收的訊息無法理解。
2. 愛拚才會贏 (Ài piànn tsiah ē iânn) - 比喻唯有努力奮鬥,才能克服困難,成就一番事業。
3. 愛嬌毋驚流鼻水 (Ài-suí m̄ kiann lâu phinn-tsuí) - 常用以揶揄女性愛美,寧可付出代價,也在所不惜。
4. 暗頓減食一口,活甲九十九 (Àm-tǹg kiám tsia̍h tsi̍t kháu, ua̍h kah káu-tsa̍p-káu) - 說明晚餐的食用量少一點,有益身體健康。
5. 翁仔某是相欠債 (Ang-á-bóo sī sio-khiàm-tsè) - 夫妻意見不合相互爭吵時,常用這句話來勸雙方姻緣前定,應以和為貴。
6. 翁某若仝心,烏塗變成金 (Ang-bóo nā kāng-sim, oo-thôo piàn-sîng kim) - 比喻夫妻和諧,一起努力,任何事都可成就。
7. 尪姨順話尾,假童害眾人 (Ang-î sūn uē-bué, ké tâng hāi tsìng-lâng) - 指靈媒、乩童借揣摩情況來決定說話的內容,而人也因輕信巫術鬼神而身受其害。
8. 翁親某親,老婆仔拋掉輪 (Ang tshin bóo tshin, lāu-pô-á pha-tshia-lìn) - 比喻夫妻二人恩恩愛愛,置年邁雙親於不顧。
9. 紅媠,烏大範 (Âng suí, oo tuā-pān) - 紅色顯得鮮豔亮麗,黑色呈現高貴大方。
10. 䆀猴 gâu 欠數 (Bái-kâu gâu khiàm-siàu) - 形容人外型不佳又愛賒帳。
11. 目調花花,匏仔看做菜瓜 (Ba̍k-tsiu hue-hue, pû-á khuànn-tsò tshài-kue) - 嘲笑別人一時恍神,把形狀相近的物品看成別的東西。
12. 目調看懸,無看低 (Ba̍k-tsiu khuànn kuân, bô khuànn-kē) - 引申為人勢利、看不起身分較低的人。
13. 目調看佇粿,跤踏著火 (Ba̍k-tsiu khuànn tī kué, kha ta̍h-tio̍h hué) - 勸人做事不要只顧當前的好處,而忘了週遭的危險。
14. 目調金金人傷重 (Ba̍k-tsiu kim-kim lâng siong-tiōng) - 比喻遇到事情束手無策,只能乾瞪眼而沒辦法處理。
15. 目調掛斗概,看人物就愛 (Ba̍k-tsiu kuà táu-kài, khuànn lâng mi̍h tō ài) - 比喻想把別人的東西納為己有的貪婪心態。
16. 慢牛厚屎尿 (Bān gû kāu-sái-jiō) - 比喻懶惰的人做事不乾脆,常找藉口逃避或延遲該盡的責任。
17. 萬事起頭難 (Bān-sū khí-thâu lân) - 一切事情開頭階段都很困難。
18. 買賣算分,相請無論 (Bé-bē sǹg hun, sio-tshiánn bô lūn) - 說明生意與交情的界線理應分明。
19. 買田愛揀好田底,娶某愛揀好娘咧 (Bé tshân ài kíng hó tshân té, tshuā-bóo ài kíng hó niû-lé) - 說明選妻子時對方家教的重要。
20. 買厝,買厝邊 (Bé tshù, bé tshù-pinn) - 強調選擇住家時,鄰居的好壞至關重要。
21. 袂曉剃頭,拄著鬍鬚 (Bē-hiáu thì thâu, tú-tio̍h hôo-tshiu) - 比喻在經驗不足的情況下,偏偏碰上了棘手的難題。
22. 賣茶講茶芳,賣花講花紅 (Bē tê kóng tê phang, bē hue kóng hue âng) - 比喻老王賣瓜,自賣自誇。
23. 欲好額等後世,欲做官學做戲 (Beh hó-gia̍h tán āu-sì, beh tsò-kuann o̍h tsò-hì) - 諷刺人此生再無致富與升官的機會。
24. 無米有春臼、無囝抱新婦 (Bô bí ū tshun-khū, bô kiánn phō sin-pū) - 形容人只會做白日夢,不切實際。
25. 無牛駛馬 (Bô gû sái bé) - 形容退而求其次,暫且代用的無奈。
26. 無魚、蝦嘛好 (Bô hî, hê mā hó) - 比喻退而求其次,聊勝於無。
27. 無彼號尻川,想欲食彼號瀉藥 (Bô hit-lō kha-tshng, siūnn-beh tsia̍h hit-lō sià-io̍h) - 比喻一個人自不量力。
28. 無日毋知晝,無鬚毋知老 (Bô ji̍t m̄ tsai tàu, bô tshiu m̄ tsai lāu) - 比喻光陰易逝,很容易在不知不覺中荒廢。
29. 無枷夯交椅 (Bô kê giâ kau-í) - 比喻自找麻煩,庸人自擾。
30. 無禁無忌,食百二 (Bô-kìm-bô-khi, tsia̍h pah-jī) - 通常是觸碰禁忌者用來自我安慰的說法。
31. 無毛雞假大格 (Bô môo ke ké tuā-keh) - 指人明明沒有才能,還裝出很有本事的樣子。
32. 無通生食,哪有通曝乾 (Bô thang tshenn tsia̍h, ná ū thang pha̍k-kuann) - 比喻數量不足,不可能有多餘的留下來。
33. 罔趁較袂散 (Bóng thàn khah bē sàn) - 說明即使利潤非常小,也應積極賺取。
34. 某大姊,坐金交椅 (Bóo-tuā-tsí, tsē kim kau-í) - 形容少夫老妻,丈夫很受寵、頗享福。
35. 無三不成禮 (Bû sam put sîng lé) - 比喻禮多人不怪。
36. 未食五日節粽,破裘毋甘放 (Buē tsia̍h Gōo-ji̍t-tseh tsàng, phuà hiû m̄ kam pàng) - 尚未過端午節,冬衣不能收起來。
37. 未曾學行先學飛,未曾掖種想挽瓜 (Buē-tsîng o̍h kiânn sing o̍h pue, buē-tsîng iā-tsíng siūnn bán kue) - 指人要循序漸進,絕無一步登天。
38. 會晚偷食,袂曉拭喙 (Ē-hiáu thau tsia̍h, bē-hiáu tshit tshuì) - 比喻做壞事後,不懂得湮滅證據。
39. 會咬人的狗袂吠 (Ē kā lâng ê káu bē puī) - 比喻城府甚深之人少言,不易流露其情緒。
40. 會跋才會大 (Ē pua̍h tsiah ē tuā) - 比喻人要經歷過失敗、挫折,才能成就事業。
41. 會生得囝身,袂生得囝心 (Ē-senn-tit kiánn sin, bē-senn-tit kiánn sim) - 指教育孩子很不容易,往往不能按照父母的期待。
42. 疑人,毋成賊 (Gî lâng, m̄ tsiânn tsha̍t) - 謂凡事都要講求證據,不能只因內心懷疑,便將人入罪。
43. 舉頭三尺有神明 (Gia̍h-thâu sann tshioh ū sîn-bîng) - 告誡人們做事前要三思,千萬別做虧心事。
44. 嚴官府出厚賊;嚴爸母出阿里不達 (Giâm kuann-hú tshut kāu tsha̍t; giâm pē-bú tshut a-lí-put-ta̍t) - 喻適當的律法及教育更為重要。
45. 囡仔人尻川三斗火 (Gín-á-lâng kha-tshng sann táu hué) - 形容孩子不怕冷。
46. 囡仔人有耳無喙 (Gín-á-lâng ū-hīnn-bô-tshuì) - 指叫小孩聽話就好,不要多問。
47. 戇的也有一項會 (Gōng--ê iā ū tsi̍t hāng ē) - 比喻天生我才必有用。
48. 五肢指頭仔伸出來無平長 (Gōo ki tsíng-thâu-á tshun--tshut-lai bô pênn tn̂g) - 兄弟姊妹其聰明才智並非一致,仍舊有所不同。
49. 牛牢內觸牛母 (Gû-tiâu-lāi tak gû-bó) - 比喻兄弟或同志只善內鬥、欺負弱小,卻不能抵禦外侮。
50. 牛就是牛,牽到北京也是牛 (Gû tō sī gû, khan kàu Pak-kiann iā sī gû) - 形容人的個性不可能改變。
51. 外甥食母舅,親像食豆腐 (Guē-sing tsia̍h bú-kū, tshin-tshiūnn tsia̍h tāu-hū) - 喻外甥要倚靠舅父幫忙或讓舅父請客較為容易。
52. 校長兼摃鐘 (Hāu-tiúnn kiam kòng tsing) - 形容一個人身兼數職。
53. 蝦姑袂忍得嗽 (Hê-ku bē lún tit sàu) - 形容人忍無可忍,不吐不快。
54. 戲館邊的豬母,袂歕簫嘛會拍拍 (Hì-kuán pinn ê ti-bó, bē pûn siau mā ē phah-phik) - 比喻常見無難事;或指人易受周圍環境影響。
55. 戲棚跤待久就是你的 (Hì-pênn-kha khiā kú tō sī lí ê) - 勸人做事要有耐性,如能持之以恆,成功必屬於你的。
56. 嫌貨才是買貨人 (Hiâm huè tsiah-sī bé huè lâng) - 意即客人會對貨物表示意見才是真正要購買的人。
57. 兄弟若仝心,烏塗變成金 (Hiann-tī nā kāng sim, oo-thôo piàn-sîng kim) - 鼓勵手足之間應通力合作,便能得到耀眼的成果。
58. 僥倖錢,失德了;冤枉錢,跋輸筊 (Hiau-hīng-tsînn, sit-tik liáu; uan-óng-tsînn, pua̍h-su kiáu) - 誡人勿貪非分及不義之財。
59. 耳仔生兩葉,家已看袂著 (Hīnn-á senn nn̄g hio̍h, ka-kī khuànn bē tio̍h) - 意指人看不見自己的缺點。
60. 好額毋值著會食、好命毋值著勇健 (Hó-gia̍h m̄-ta̍t-tio̍h ē tsia̍h, hó-miā m̄-ta̍t-tio̍h ióng-kiānn) - 說明有食欲、身體健康比起財富或運勢都還更重要。
61. 好好鱟 thâi 甲屎那流 (Hó-hó hāu thâi kah sái ná lâu) - 譏諷人做事不得要領,將簡單之事弄得一團糟。
62. 好也一句,歹也一句 (Hó iā tsi̍t kù, pháinn iā tsi̍t kù) - 一句話的好壞會影響聽者日後的行為,所以與人交談不可不慎。
63. 好囝毋免濟,濟囝餓死爸 (Hó-kiánn m̄-bián tsē, tsē kiánn gō-sí pē) - 順父母者最為重要。
64. 好歹在心內,喙脣皮相款待 (Hó-pháinn tsai sim-lāi, tshuì-tûn-phuê sio khuán-thāi) - 不管好壞都放在心裡,口頭上還是要客客氣氣。
65. 好心予雷唚 (Hó-sim hōo luî tsim) - 比喻好心沒好報。
66. 好田地不如好子弟 (Hó tshân-tē put-jû hó tsú-tē) - 子孫的人品與才學,比財富更有價值。
67. 好酒沉甕底 (Hó-tsiú tîm àng-té) - 比喻好的、精彩的事物,總是留在最後面才出現。
68. 胡蠅舞屎𤲍 (Hôo-sîn bú sái-pue) - 恥笑人做事不自量力。
69. 互相落氣,求進步 (Hōo-siong làu-khuì, kiû tsìn-pōo) - 一來一往檢討雙方各自的缺點,是一種求取進步的方法。
70. 歡歡喜喜一工,煩煩惱惱也一工 (Huann-huann-hí-hí tsi̍t kang, huân-huân-ló-ló iā tsi̍t kang) - 勸人樂觀進取,不要太過悲觀。
71. 花無百日紅、人無千日好 (Hue bô pah ji̍t âng, lâng bô tshian ji̍t hó) - 比喻人生是起起伏伏的,本來就無法永遠順利。
72. 和尚頭掠蝨母 (Huê-siūnn thâu lia̍h sat-bó) - 形容人緣木求魚,注定失敗。
73. 也著箠,也著糜 (Iā tio̍h tshuê, iā tio̍h muê) - 比喻父母教導子女要寬嚴得宜、慈威並施。
74. 閹雞趁鳳飛 (Iam-ke thàn hōng pue) - 比喻如同東施效顰一樣想模仿別人。
75. 枵鬼假細膩 (Iau-kuí ké sè-jī) - 諷刺人表裡不一,惺惺作態。
76. 陰鴆陰鴆,咬人三寸深 (Im-thīm-im-thīm, kā lâng sann tshùn tshim) - 勸戒人要謹防陰險狠毒之徒。
77. 圓人會扁,扁人會圓 (Înn-lâng ē pínn, pínn-lâng ē înn) - 形容人的機運有起有落。
78. 搖人無才,搖豬無 thâi (Iô lâng bô-tsâi, iô ti bô thâi) - 勉勵人應穩重自持。
79. 勇勇馬縛佇將軍柱 (Ióng-ióng bé pa̍k tī tsiong-kun-thiāu) - 引申為懷才不遇、英雄無用武之地。
80. 用別人的拳頭拇舂石獅 (Iōng pa̍t-lâng ê kûn-thâu-bú tsing tsioh-sai) - 比喻犧牲他人來成就自己。
81. 一兼二顧,摸蜊仔兼洗褲 (It kiam jī kòo, bong lâ-á kiam sé khòo) - 意謂一舉兩得。
82. 一代親,二代表,三代毋捌了了 (It tāi tshin, jī tāi piáu, sann tāi m̄ bat liáu-liáu) - 意為親戚間的往來,一代比一代疏遠。
83. 一錢,二緣,三媠,四少年 (It tsînn, jī iân, sann suí, sì siàu-liân) - 舊時男性追求女性的基本條件。
84. 幼秀跤,好命底 (Iù-siù kha, hó-miā té) - 進而產生「幼秀跤」的女性為富貴人家的刻板印象。
85. 惹熊惹虎,毋通惹著刺查某 (Jiá hîm jiá hóo, m̄-thang jiá-tio̍h tshiah-tsa-bóo) - 比喻悍婦得罪不得。
86. 人情留一線,日後好相看 (Jîn-tsîng lâu tsi̍t suànn, ji̍t-āu hó sio-khuànn) - 意謂與人為善,凡事多留餘地。
87. 人情世事陪到到,無鼎閣無灶 (Jîn-tsîng-sè-sū puê kàu-kàu, bô tiánn koh bô tsàu) - 勸導人應酬要節制,適可而止。
88. 入虎口,無死也烏奧 (Ji̍p hóo kháu, bô sí iā oo-áu) - 意謂掉入危險環境,沒死也剩下半條命。
89. 入人門,順人意 (Ji̍p lâng mn̂g, sūn lâng ì) - 指進入別人的家門,順從別人的意見。
90. 日頭赤焱焱,隨人顧性命 (Ji̍t-thâu tshiah-iānn-iānn, suî-lâng kòo sènn-miā) - 形容人遇到患難或在艱困的環境裡,以顧全自己為先。
91. 家和萬事興,家亂萬世窮 (Ka hô bān-sū hing, ka luān bān-sè kîng) - 強調家庭和樂與否對家道的發展影響深遠。
92. 家己捧屎抹面 (Ka-kī phâng-sái buah-bīn) - 比喻自己給自己難看,自取其辱。
93. 家己栽一欉,較贏看別人 (Ka-kī tsai tsi̍t tsâng, khah iânn khuànn pa̍t-lâng) - 比喻凡事得靠自己,不要靠別人。
94. 教豬教狗,不如家己走 (Kà ti kà káu, put-jû ka-kī tsáu) - 比喻與其依靠別人不如靠自己。
95. 共天公借膽 (Kā Thinn-kong tsioh tánn) - 用於形容人突然膽大包天,做出平常不敢做的事。
96. 甘願做牛,毋驚無犁通拖 (Kam-guān tsò gû, m̄ kiann bô lê thang thua) - 只要願意放下身段,努力工作,不怕沒有機會。
97. 甘蔗無雙頭甜 (Kam-tsià bô siang-thâu tinn) - 比喻世事無法兩全其美。
98. 艱苦頭、快活尾 (Kan-khóo thâu, khuìnn-ua̍h bué) - 勸勉人先苦後甘,終將逐步進入佳境。
99. 敢做匏桸,就毋通驚水燙 (Kánn tsò pû-hia, tō m̄-thang kiann tsuí thǹg) - 意指既然承擔了責任就要敢做敢當。
100. 狗無嫌主人散 (Káu bô hiâm tsú-lâng sàn) - 勸人不要因家境貧苦而怪責父母。
101. 九月颱,無人知 (Káu-gue̍h thai, bô lâng tsai) - 比喻天有不測風雲,人有旦夕禍福。
102. 猴也會跋落樹跤 (Kâu iā ē pua̍h-lo̍h tshiū-kha) - 說明經驗再豐富的人,也有失手的時候。
103. 加減趁,較袂散 (Ke-kiám thàn, khah bē sàn) - 形容不要計較所得多寡,努力工作才不會陷入窮困。
104. 雞卵密密也有縫 (Ke-nn̄g ba̍t-ba̍t iā ū phāng) - 比喻事情總會有破綻,不可能天衣無縫。
105. 雞屎落塗,也有三寸煙 (Ke sái lo̍h thôo, iā ū sann tshùn ian) - 做人要擁有志氣。
106. 嫁雞隨雞,嫁狗隨狗 (Kè ke tuè ke pue, kè káu tuè káu tsáu) - 不論丈夫是什麼樣的人,都要終身跟隨。
107. 隔壁親家,禮數原在 (Keh-piah tshin-ke, lé-sòo guân-tsāi) - 親家住得再近,應有的禮節還是不可疏忽怠慢。
108. 牽尪姨,順話尾 (Khan ang-î, sūn uē-bué) - 比喻交談時揣摩對方的心思來應答。
109. 氣死驗無傷 (Khì-sí giām bô siong) - 用來告誡人勿逞血氣,以免傷身。
110. 徛懸山,看馬相踢 (Khiā kuân suann, khuànn bé sio-that) - 比喻置身事外,袖手旁觀。
111. 欠錢怨債主,不孝怨爸母 (Khiàm tsînn uàn tsè-tsú, put-hàu uàn pē-bú) - 比喻不知反省,只會把責任推到他人身上。
112. 缺喙的食米粉,看現現 (Khih-tshuì--ê tsia̍h bí-hún, khuànn-hiān-hiān) - 引申為虛偽或技拙者的所作所為,無所遁形讓人一目了然。
113. 乞食下大願 (Khit-tsia̍h hē tuā guān) - 比喻夢想也要衡量現實,不宜不自量力。
114. 乞食也有三年好運 (Khit-tsia̍h iā ū sann nî hó-ūn) - 勉勵人毋須因一時的挫折、低潮而灰心喪志。
115. 乞食趕廟公 (Khit-tsia̍h kuánn biō-kong) - 比喻喧賓奪主。
116. 乞食身,皇帝喙 (Khit-tsia̍h sin, hông-tè tshuì) - 比喻人說話大言不慚,與自己實際身份不相稱。
117. 勸人做好代,較贏食早齋 (Khǹg lâng tsò hó tāi, khah iânn tsia̍h tsá-tsai) - 說明行善比獨善其身重要。
118. 勸您有孝千萬句、袂曉有孝豬狗牛 (Khǹg lín iú-hàu tshian-bān kù, bē hiáu iú-hàu ti káu gû) - 勸人要懂得孝順,否則連畜牲都不如。
119. 靠山山會崩,靠水水會焦 (Khò suann suann ē pang, khò tsuí tsuí ē ta) - 勸人凡事要自立自強,不可太依賴別人。
120. 看人食肉,毋通看人相拍 (Khuànn lâng tsia̍h bah, m̄-thang khuànn lâng sio-phah) - 誡人遠離是非之地,以免遭受池魚之殃。
121. 見笑轉受氣 (Kiàn-siàu tńg siū-khì) - 即惱羞成怒。
122. 驚某大丈夫,拍某豬狗牛 (Kiann bóo tāi-tiōng-hu, phah bóo ti káu gû) - 規勸丈夫要好好疼惜自己的妻子,不可動粗。
123. 驚驚袂著等 (Kiann-kiann bē tio̍h-tíng) - 勸人做事要果決,不要畏畏縮縮。
124. 囝婿是半子 (Kiánn-sài sī puàn-tsú) - 女婿是半個兒子。
125. 行船走馬三分命 (Kiânn-tsûn tsáu-bé sann hun miā) - 意謂從事交通運輸行業的人,喪失生命的風險很高。
126. 緊行無好步 (Kín kiânn bô hó pōo) - 喻遇事不宜急躁,應冷靜沉穩面對。
127. 緊紡無好紗,緊嫁無好大家 (Kín pháng bô hó se, kín kè bô hó ta-ke) - 比喻欲速則不達。
128. 近廟欺神 (Kīn biō khi sîn) - 比喻貴遠賤近。
129. 近山剉無柴,近溪擔無水 (Kīn suann tshò bô tshâ, kīn khe tann bô tsuí) - 反諷人往往捨近求遠,忽略了身邊隨手可得的資源。
130. 近水知魚性,近山識鳥音 (Kīn suí ti gû sìng, kīn san sik niáu im) - 比喻在怎樣的環境中生活,就容易學習到和該環境相關的才能。
131. 弓蕉吐囝為囝死 (King-tsio thòo kiánn uī kiánn sí) - 比喻父母為了子女,總是無盡的犧牲奉獻。
132. 揀啊揀,揀著一个賣龍眼 (Kíng-ah kíng, kíng-tio̍h tsi̍t ê bē lîng-gíng) - 勸人有人可選時不要過份挑剔。
133. 公親變事主 (Kong-tshin piàn sū-tsú) - 意指和事佬難當,調解不成還被拖下水。
134. 講著食,觸破額 (Kóng-tio̍h tsia̍h, tsi̍k-phuà hia̍h) - 比喻人們為了爭權奪利而不顧形象的模樣。
135. 講一个影,生一个囝 (Kóng tsi̍t ê iánn, senn tsi̍t ê kiánn) - 比喻把沒聽清楚的話,轉述成毫不相關的事。
136. 龜跤龜內肉 (Ku-kha ku-lāi bah) - 比喻所獲得的利益,實際上是來自本身。
137. 龜跤趖出來 (Ku-kha sô-tshut-lâi) - 即露出馬腳。
138. 龜笑鱉無尾,鱉笑龜粗皮 (Ku tshiò pih bô bué, pih tshiò ku tshoo phuê) - 指人只會批評別人的缺點,卻不知自己的缺點也不少。
139. 久長病、無孝子 (Kú-tn̂g pēnn, bô hàu-tsú) - 比喻久病床前無孝子。
140. 舊囚食新囚 (Kū siû tsia̍h sin siû) - 比喻資歷老的成員欺凌新進人員。
141. 關門著閂,講話著看 (Kuainn-mn̂g tio̍h tshuànn, kóng-uē tio̍h khuànn) - 勸人說話要看時機,不要因一時大意而造成難以收拾的局面。
142. 過橋較濟你行路,食鹽較濟你食米 (Kuè kiô khah tsē lí kiânn-lōo, tsia̍h iâm khah tsē lí tsia̍h bí) - 年長者常以此來自誇經驗豐富。
143. 過時賣曆日 (Kuè-sî bē la̍h-ji̍t) - 用來指事物已經失去時效。
144. 骨力食栗,貪惰吞瀾 (Kut-la̍t tsia̍h-la̍t, pîn-tuānn thun nuā) - 比喻一分耕耘,一分收穫。
145. 內神通外鬼 (Lāi sîn thong guā kuí) - 指內部人員串通外面的人,做出不利內部的事。
146. 六月芥菜假有心 (La̍k-gue̍h kuà-tshài ké ū-sim) - 指人的言語或行為虛情假意。
147. 人無照天理,天無照甲子 (Lâng bô tsiàu thinn-lí, thinn bô tsiàu kah-tsí) - 指對於違反常理之事的感慨。
148. 人未到,聲先到 (Lâng buē kàu, siann sing kàu) - 形容大嗓門的人。
149. 人的喙,掩袂密 (Lâng ê tshuì, am bē ba̍t) - 亦即難杜悠悠之口。
150. 人牽毋行,鬼牽溜溜行 (Lâng khan m̄ kiânn, kuí khan liù-liù-kiânn) - 形容人是非不分,正事不做,偏要做壞事。
151. 人若衰,種匏仔生菜瓜 (Lâng nā sue, tsìng pû-á senn tshài-kue) - 比喻人的運氣不佳,老是事與願違。
152. 人兩跤,錢四跤 (Lâng nn̄g kha, tsînn sì kha) - 比喻賺錢不易。
153. 人心肝,牛腹肚 (Lâng sim-kuann, gû pak-tóo) - 比喻人心不足蛇吞象。
154. 人咧做,天咧看 (Lâng teh tsò, thinn teh khuànn) - 比喻天理昭昭,報應不爽。
155. 人濟話就濟、三色人講五色話 (Lâng tsē uē tō tsē, sam sik lâng kóng ngóo sik uē) - 比喻人多意見多,莫衷一是。
156. 人飼人,一支骨;天飼人,肥卒卒 (Lâng tshī lâng, tsi̍t ki kut; thinn tshī lâng, puî-tsut-tsut) - 意即成事在天,有上天的庇蔭,人纔有好日子可以過。
157. 老的老步定,少年的較懂嚇 (Lāu-ê lāu-pōo-tiānn, siàu-liân--ê khah táng-hiann) - 老人家做事較沉穩持重,年輕人做事則比較輕浮莽撞。
158. 老人毋講古,少年毋捌寶 (Lāu-lâng m̄ kóng-kóo, siàu-liân m̄ bat pó) - 形容老年人有很多值得年輕人學習的經驗。
159. 離鄉,無離腔 (Lī hiunn, bô lī khiunn) - 雖然離開故鄉,卻很難改變故鄉的口音腔調。
160. 了錢生理無人做, thâi 頭生理有人做 (Liáu-tsînn sing-lí bô lâng tsò, thâi-thâu sing-lí ū lâng tsò) - 形容無良商人為了賺錢而不擇手段。
161. 龍交龍,鳳交鳳,隱痀的交侗戇 (Liông kau liông, hōng kau hōng, ún-ku--ê kau tòng-gōng) - 比喻朋友是物以類聚的。
162. 溜溜瞅瞅,食兩蕊目睭 (Liu-liu-tshiu-tshiu, tsia̍h nn̄g luí ba̍k-tsiu) - 說明人在社會上要會察言觀色,審時度勢。
163. 落塗時八字命 (Lo̍h-thôo-sî peh-jī miā) - 這句話常用來要人接受現狀,不要埋怨或強求。
164. 落水平平沉,全無重頭輕 (Lo̍h tsuí pênn-pênn tîm, tsuân bô tāng-thâu-khin) - 說明大難來時大家的命運相同。
165. 忍氣求財,激氣相 thâi (Lún-khì kiû tsâi, kik khì sio-thâi) - 比喻和氣生財。
166. 毛毛仔雨落久,塗嘛會澹 (Mông-mông-á hōo lo̍h-kú, thôo mā ē tâm) - 比喻積少成多;或指做事只要能持之以恆。
167. 毛呼龜粿粽,紅包在你送 (Môo-honn ku kué tsàng, âng-pau tsāi lí sàng) - 譏諷道士誦經時不專心,心中只有紅包。
168. 媒人保入房,無保一世人 (Muê-lâng pó ji̍p pâng, bô pó tsi̍t-sì-lâng) - 說明他人的幫助或保證都是有限度的,凡事還是得靠自己努力。
169. 涼傘雖破,骨格原在 (Niû-suànn sui phuà, kut-keh guân-tsāi) - 比喻一個人以前功成名就,現在雖然落魄失意,卻仍保有骨氣。
170. 爛塗袂糊得壁 (Nuā thôo bē kôo tit piah) - 指人或東西沒有用,派不上用場。
171. 呵咾甲會觸舌 (O-ló kah ē tak-tsi̍h) - 可用來表示「讚美有加」。
172. 惡馬惡人騎 (Ok bé ok lâng khiâ) - 比喻壞人自有比他更凶惡的人來懲治他。
173. 王梨頭,西瓜尾 (Ông-lâi thâu, si-kue bué) - 鳳梨蒂頭的一端比較甜,西瓜是離蒂頭最遠的一端最甜。
174. 烏仔魚搦水 (Oo-á-hî tsīnn tsuí) - 比喻不畏困難,積極向上。
175. 烏矸仔貯豆油 (Oo kan-á té tāu-iû) - 比喻看走眼或人不可貌相。
176. 飽穗的稻仔,頭犁犁 (Pá-suī ê tiū-á, thâu lê-lê) - 比喻有真實才學的人,反倒謙沖為懷。
177. 腹肚若水櫃,胸坎若樓梯 (Pak-tóo ná tsuí-kuī, hing-khám ná lâu-thui) - 形容人營養不良。
178. 腹肚做藥櫥 (Pak-tóo tsò io̍h-tû) - 比喻人體弱多病,長期服藥。
179. 放屁安狗心 (Pàng-phuì an káu sim) - 比喻敷衍的給予承諾。
180. 別人的囝死袂了 (Pa̍t-lâng ê kiánn sí bē liáu) - 形容人非常自私,為了自己的利益,不顧別人的死活。
181. 爸母疼囝長流水,囝疼爸母樹尾風 (Pē-bú thiànn kiánn tn̂g lâu-tsuí, kiánn thiànn pē-bú tshiū-bué hong) - 告誡人們要時時刻刻記得孝順父母。
182. 白白布染甲烏 (Pe̍h-pe̍h pòo ní kah oo) - 比喻刻意汙衊抹黑,顛倒是非。
183. 棚頂做甲流汗,棚跤嫌甲流瀾 (Pênn-tíng tsò kah lâu-kuānn, pênn-kha hiâm kah lâu-nuā) - 比喻開口批評容易,實際去做卻很困難。
184. 拍虎掠賊也著親兄弟 (Phah hóo lia̍h tsha̍t iā tio̍h tshin hiann-tī) - 喻手足之情最為可靠。
185. 拍人喝救人 (Phah lâng huah-kiù-lâng) - 比喻為逃避責任或轉移焦點,做壞事的人反而誣告別人做壞事。
186. 拍斷手骨顛倒勇 (Phah-tn̄g tshiú-kut tian-tò ióng) - 意即愈挫愈勇。
187. 歹瓜厚子,歹人厚言語 (Pháinn kue kāu tsí, pháinn-lâng kāu giân-gí) - 用來諷刺多話或是善於搬弄是非的人。
188. 歹竹出好筍 (Pháinn tik tshut hó sún) - 比喻在惡劣的外在環境下仍能養成優秀的人。
189. 歹竹出好筍,好竹出痀崙 (Pháinn tik tshut hó sún, hó tik tshut ku-lūn) - 比喻出身不好的人也能養成好的後代,富貴之人也會出不成才的子孫。
190. 歹船拄著好港路 (Pháinn tsûn tú-tio̍h hó káng-lōo) - 比喻外在環境大好,本身雖不濟,卻也能安然度過。
191. 皮皮食甲流 喙 (Phî phî tsia̍h kah lâu tsi) - 比喻人不知羞恥。
192. 膨風水雞 thâi 無肉 (Phòng-hong tsuí-ke thâi bô bah) - 譏諷言談誇大不實、常吹牛的人。
193. 鋪面蟶,浸水蚵 (Phoo-bīn than, tsìm-tsuí ô) - 比喻虛有其表或無心實踐。
194. 跋一倒,扶著一隻金雞母 (Pua̍h tsi̍t tó, khioh-tio̍h tsi̍t tsiah kim ke-bó) - 比喻因禍得福。
195. 杯底毋通飼金魚 (Pue-té m̄-thang tshī kim-hî) - 暗示人把杯裡的酒喝乾之意。
196. 分袂平,拍甲二九暝 (Pun bē pênn, phah kah Jī-káu-mê) - 指事情分配不公,會引起長期的紛爭。
197. 西北雨,落袂過車路 (Sai-pak-hōo, lo̍h bē kuè tshia-lōo) - 比喻夏日午後雷陣雨,下得非常短暫。
198. 瘦田 gâu 吸水 (Sán tshân gâu suh tsuí) - 指瘦小的人食量很大。
199. 送伊魚,較輸教伊掠魚 (Sàng i hî, khah-su kà i lia̍h hî) - 比喻與其救濟或幫助他人,不如教他謀生的能力。
200. 三分人,七分妝 (Sann hun lâng, tshit hun tsng) - 提醒人要注意穿著打扮,更能增添個人的魅力。
201. 三日無餾,爬上樹 (Sann ji̍t bô liū, peh-tsiūnn tshiū) - 說明學過的東西要勤加溫習。
202. 三跤步一坎店 (Sann kha-pōo tsi̍t khám tiàm) - 形容市景繁榮,商店林立。
203. 三講,四毋著 (Sann kóng, sì m̄-tio̍h) - 指人說話頻頻出錯。
204. 三人共五目,日後無長短跤話 (Sann lâng kāng gōo ba̍k, ji̍t-āu bô tn̂g-té-kha-uē) - 比喻共同商議後所做的決定,事後不得反悔。
205. 三年一閏,好歹照輪 (Sann nî tsi̍t jūn, hó-pháinn tsiàu lûn) - 指風水輪流轉。
206. 三百六十行,行行出狀元 (Sann-pah la̍k-tsa̍p hâng, hâng-hâng tshut tsiōng-guân) - 比喻不論從事何種行業,都可出人頭地。
207. 三代粒積,一代窮空 (Sann tāi lia̍p-tsik, tsi̍t tāi khîng-khong) - 比喻創業艱辛,守成要謹慎。
208. 掃地掃壁角,洗面洗耳空 (Sàu-tē sàu piah-kak, sé-bīn sé hīnn-khang) - 指做事要澈底實在,不要馬虎隨便。
209. 細漢煩惱伊袂大,大漢煩惱伊未娶 (Sè-hàn huân-ló i bē tuā, tuā-hàn huân-ló i buē tshuā) - 表示父母親對兒女成長的各個階段,都有不同的操心與煩惱。
210. 細漢偷挽匏,大漢偷牽牛 (Sè-hàn thau bán pû, tuā-hàn thau khan gû) - 指一味縱容小孩的錯誤行為,反而會使其積惡成習。
211. 細空毋補,大空叫苦 (Sè khang m̄ póo, tuā khang kiò-khóo) - 勸人若發現小問題,應及時修正。
212. 生的且一邊,養的恩情較大天 (Senn-ê tshiánn tsi̍t pinn, iúnn--ê un-tsîng khah tuā thinn) - 提醒被撫養人不要抹煞養育人的苦心與功勞。
213. 生雞卵的無,放雞屎的有 (Senn ke-nn̄g-ê bô, pàng ke-sái-ê ū) - 形容團體中只有會惹事生非,帶來壞處或麻煩的人。
214. 生囝師仔,飼囝師傅 (Senn-kiánn sai-á, tshī kiánn sai-hū) - 比喻生小孩算不上本事,要把孩子養育成有用的人才是真本領。
215. 西瓜倚大爿 (Si-kue uá tuā pîng) - 意指人看哪一邊得勢,就向那邊,形容人趨炎附勢。
216. 死目毋願瞌 (Sí ba̍k m̄ guān kheh) - 指因還有未完成的心願或牽掛的事而死不瞑目。
217. 死皇帝毋值得活乞食 (Sí hông-tè m̄-ta̍t-tit ua̍h khit-tsia̍h) - 勉勵人要珍惜生命,窮苦活著總比富貴死去還要強。
218. 死道友,無死貧道 (Sí tō-iú, bô sí pîn-tō) - 說明人不在乎別人的死活,只關心自己是否還安好。
219. 死蛇活尾溜 (Sí tsuā ua̍h bué-liu) - 形容事情雖然已經結束,但還留下一個殘局未收拾。
220. 時到時擔當,無米才煮番薯湯 (Sî kàu sî tam-tng, bô bí tsiah tsú han-tsî-thng) - 形容事情自然有因應之道。
221. 是毋是,罵家已 (Sī m̄ sī, mē ka-kī) - 人與人相處難免會有衝突,遇到事情先檢討自己。
222. 仙人拍鼓有時錯,跤步踏差啥人無? (Sian-jîn phah kóo iú sî tshò, kha-pōo ta̍h-tsha siánn-lâng bô?) - 指再厲害的人難免也會出差錯。
223. 仙拚仙,害死猴齊天 (Sian piànn sian, hāi-sí Kâu Tsê-thian) - 比喻兩方拼鬥,卻禍延無辜的第三者。
224. 雙个旋,惡甲無人問 (Siang ê tsng, ok kah bô lâng mn̄g) - 傳統認為有兩個髮旋的人天性兇。
225. 雙手抱孩兒,才知爸母時 (Siang-tshiú phō hâi-jî, tsiah tsai pē-bú sî) - 勸人要感念父母的養育之恩,孝順父母。
226. 痟狗舂墓壙 (Siáu-káu tsing bōng-khòng) - 指行事莽撞;也引申爭名奪利,指人有利可圖,不顧一切巧取豪奪。
227. 痟貪鑽雞籠 (Siáu-tham nǹg ke-lam) - 勸人千萬不要貪得無厭。
228. 少年袂曉想,食老毋成樣 (Siàu-liân bē-hiáu siūnn, tsia̍h-lāu m̄-tsiânn-iūnn) - 勉勵人年輕時要有遠見,努力為未來鋪路。
229. 少年若無一擺 gōng,路邊哪有有應公 (Siàu-liân nā bô tsi̍t pái gōng, lōo-pinn ná ū Iú-ìng-kong) - 引申為勸誡年輕人勿逞血氣之勇。
230. 心歹無人知,喙歹上厲害 (Sim pháinn bô lâng tsai, tshuì pháinn siōng lī-hāi) - 告誡人要謹言慎行。
231. 神明興,弟子窮 (Sîn-bîng hing, tē-tsú kîng) - 勸人敬拜神明花費要節制。
232. 誠意食水甜 (Sîng-ì tsia̍h tsuí tinn) - 比喻人和人之間的相處,誠意是最重要的。
233. 倖豬夯灶,倖囝不孝 (Sīng ti giâ tsàu, sīng kiánn put-hàu) - 比喻子女要適度管教,不能一味溺愛。
234. 燒瓷的食缺、織蓆的睏椅 (Sio-huî-ê tsia̍h khih, tsit-tshio̍h--ê khùn í) - 比喻人為了賺錢或節儉,捨不得用自己製造的好產品。
235. 相罵無揀喙、相拍無揀位 (Sio-mē bô kíng tshuì, sio-phah bô kíng uī) - 指一般人在吵架或打架時容易喪失理智,因此任何事情都做得出來。
236. 相分食有賰,相搶食無份 (Sio-pun tsia̍h ū tshun, sio-tshiúnn tsia̍h bô hūn) - 比喻禮讓則互蒙其利,爭奪則互受其害。
237. 惜花連盆,疼囝連孫 (Sioh hue liân phûn, thiànn kiánn liân sun) - 比喻愛屋及烏。
238. 俗物無好貨 (Sio̍k-mi̍h bô hó huè) - 便宜沒好貨。
239. 俗物食破家 (Sio̍k-mi̍h tsia̍h phuà ke) - 比喻貪小便宜,反而會造成更大的損失。
240. 相命無褒,食水都無 (Siòng-miā bô po, tsia̍h tsuí to bô) - 說明江湖術士的話不可盡信,也勸人要多說好話。
241. 收瀾收予焦、予你生一个有卵葩 (Siu-nuā siu hōo ta, hōo lí senn tsi̍t ê ū lān-pha) - 期望嬰兒的母親來年能添丁。
242. 收瀾收離離,明年招小弟 (Siu-nuā siu-lī-lī, mê-nî tsio sió-tī) - 祝福其家可再添男丁。
243. 輸人毋輸陣,輸陣歹看面 (Su lâng m̄ su tīn, su tīn pháinn-khuànn bīn) - 一般用來提振團體士氣,鼓勵人奮勇向前,勿落人後。
244. 媠䆀無比止,愛著較慘死 (Suí-bái bô pí-tsí, ài-tio̍h khah tshám sí) - 只要兩情相悅,一旦愛上一個人,就會不計美醜。
245. 臺灣錢、淹跤目 (Tâi-uân tsînn, im kha-ba̍k) - 比喻臺灣遍地錢財、容易謀生。
246. 大甲溪放草魚 - 有去無回 (Tāi-kah-khe pàng tsháu-hî - ū khì bô huê) - 比喻肉包子打狗,有去無回。
247. 等物 oh 到,等人快老 (Tán mi̍h oh kàu, tán lâng khuài lāu) - 比喻等待的時間很難熬。
248. thâi 雞教猴 (Thâi ke kà kâu) - 比喻用懲罰一個人的辦法來警告別的人。
249. 讀冊,讀佇尻脊骿 (Tha̍k-tsheh, tha̍k tī kha-tsiah-phiann) - 嘲諷人讀死書,食古不化。
250. 趁也著趁,食也著食 (Thàn iā tio̍h thàn, tsia̍h iā tio̍h tsia̍h) - 勸人不要只會賺錢,也要懂得花錢吃飯。
251. 趁錢有數,性命愛顧 (Thàn-tsînn iú sòo, sènn-miā ài kòo) - 意思是賺錢要適可而止,身體健康更為重要。
252. 頭燒燒,尾冷冷 (Thâu sio-sio, bué líng-líng) - 指人做事情只有三分鐘熱度。
253. 頭大面四方,肚大居財王 (Thâu tuā bīn sù-hong, tóo tuā ki-tsâi ông) - 這是命相學的說法,未必可信。
254. 聽某喙,大富貴 (Thiann bóo tshuì, tuā hù-kuì) - 期勉丈夫適時尊重、接納太太的意見。
255. 天公疼戇人 (Thinn-kong thiànn gōng-lâng) - 實事求是、按部就班者,往往得到上天的眷顧。
256. 天頂天公,地下母舅公 (Thinn-tíng Thinn-kong, tē-hā bú-kū-kong) - 說明了在臺灣舅舅的地位崇高。
257. 豬 m̄ tuā, tuā tuì káu khì (Ti m̄ tuā, tuā tuì káu khì) - 比喻事情發展不符合自己的期許。
258. 豬岫毋值狗岫穩 (Ti-siū m̄-ta̍t káu-siū ún) - 意即金窩銀窩不如自己的狗窩。
259. 豬頭毋顧,顧鴨母卵 (Ti-thâu m̄ kòo, kòo a̍h-bó nn̄g) - 比喻放著重要的事不管,反而去管次要的。
260. 豬頭皮炸無油 (Ti-thâu-phuê tsuànn bô iû) - 用來比喻一個人不具真才實學,好吹牛。
261. 恬恬食三碗公半 (Tiām-tiām tsia̍h sann uánn-kong puànn) - 形容悶聲不響的人,卻會做出令人意想不到的事情。
262. 得失土地公,飼無雞 (Tik-sit Thóo-tī-kong, tshī bô ke) - 比喻做事若得罪有權勢或影響力的要角,恐將吃不完兜著走。
263. 頂港有名聲,下港上出名 (Tíng-káng ū miâ-siann, ē-káng siōng tshut-miâ) - 形容聲名遠播,遠近馳名。
264. 頂司管下司,鋤頭管畚箕 (Tíng-si kuán ē-si, tî-thâu kuán pùn-ki) - 形容社會有階層,一層管一層。
265. 張持無蝕本 (Tiunn-tî bô si̍h-pún) - 形容遇事謹慎處理,有益無害。
266. 斷掌查埔做相公,斷掌查某守空房 (Tn̄g-tsiúnn tsa-poo tsò siūnn-kang, tn̄g-tsiúnn tsa-bóo tsiú khang-pâng) - 這種舊思維是以往命相師的無稽之談,不宜輕信。
267. 倒吊無墨水 (Tò-tiàu bô ba̍k-tsuí) - 形容人沒學問,胸無點墨。
268. 桌頂食飯,桌跤放屎 (Toh-tíng tsia̍h-pn̄g, toh-kha pàng-sái) - 引申為受人恩惠而不知報答,反而做出對不起恩人的事情。
269. 查埔也著疼,查某也著晟 (Tsa-poo iā tio̍h thiànn, tsa-bóo iā tio̍h tshiânn) - 勸人養兒不可重男輕女。
270. 查埔囝得田園,查某囝得嫁粧 (Tsa-poo-kiánn tit tshân-hn̂g, tsa-bóo-kiánn tit kè-tsng) - 早期臺灣家庭財產分配的傳統做法。
271. 財子壽三字全 (Tsâi-tsú-siū sann jī tsuân) - 用來表示一個人樣樣俱足,幸福美滿。
272. 在生一粒豆,較贏死了拜豬頭 (Tsāi-senn tsi̍t lia̍p tāu, khah iânn sí-liáu pài ti-thâu) - 提醒人行孝要及時。
273. 十二月食菜頭,六月才轉嗽 (Tsa̍p-jī-gue̍h tsia̍h tshài-thâu, la̍k-gue̍h tsiah tńg-sàu) - 指人反應遲鈍。
274. 十二生相變透透 (Tsa̍p-jī senn-siùnn pìnn-thàu-thàu) - 形容一個人經常更換職業,沒有定性,難有成就。
275. 十囝十新婦,賰一个老寡婦 (Tsa̍p kiánn tsa̍p sin-pū, tshun tsi̍t ê lāu kuá-hū) - 形容兒子大了各自成家,年老守寡的母親卻無人願意照顧。
276. 雜唸大家出蠻皮新婦 (Tsa̍p-liām ta-ke tshut bân-phuê sin-pū) - 意即有唠叨的長輩或上司,就會有頑固不化的晚輩或部屬。
277. 十指伸出,無平長 (Tsa̍p tsíng tshun-tshut, bô pênn tn̂g) - 勸誡為人子女者,若是覺得父母有時對待子女厚此薄彼,不要過於在意。
278. 十喙九尻川 (Tsa̍p tshuì káu kha-tshng) - 比喻人多嘴雜。
279. 坐予正,得人疼 (Tsē hōo tsiànn, tit lâng thiànn) - 勸誡人要端正儀容姿態,才能讓人留下好印象。
280. 菜蟲食菜,菜跤死 (Tshài thâng tsia̍h tshài, tshài-kha sí) - 勸人勿作奸犯科,否則最後終將玩火自焚。
281. 田螺含水過冬 (Tshân-lê kâm tsuí kuè tang) - 比喻窮人含辛度日,等待時機。
282. 草地親家坐大位 (Tsháu-tē tshin-ke tsē tuā-uī) - 即不因他人身世背景,而輕忽了待客之道。
283. 臭頭仔嘛會做皇帝,做總統你嘛有機會 (Tshàu-thâu-á mā ē tsò hông-tè, tsò tsóng-thóng lí mā ū ki-huē) - 英雄不怕出身低。
284. 生狂狗食無屎 (Tshenn-kông káu tsia̍h bô sái) - 誠人處事不可操之過急。
285. 青盲貓咬著死鳥鼠 (Tshenn-mê niau kā-tio̍h sí niáu-tshí) - 比喻誤打誤撞,通常用在表示運氣很好。
286. 生食都無夠,哪有通曝乾 (Tshenn tsia̍h to bô-kàu, ná ū thang pha̍k-kuann) - 比喻現實生活已捉襟見肘,對未來的日子更不敢奢望。
287. 飼囝無論飯,飼爸母算頓 (Tshī kiánn bô-lūn pn̄g, tshī pē-bú sǹg tǹg) - 說明有些人養育子女和奉養父母時心態上的差異。
288. 飼鳥鼠,咬布袋 (Tshī niáu-tshí, kā pòo-tē) - 比喻善待親信卻遭其背叛,亦即養虎貽患。
289. 千金買厝,萬金買厝邊 (Tshian-kim bé tshù, bān kim bé tshù-pinn) - 形容敦親睦鄰之重要。
290. 千算萬算,毋值天一劃 (Tshian sǹg bān sǹg, m̄-ta̍t thinn tsi̍t ue̍h) - 說明人再如何汲汲營營算計,遇見天災或意外,還是不敵自然的力量。
291. 千途萬途,毋值得穡田塗 (Tshian tôo bān tôo, m̄ ta̍t-tit sit tshân thôo) - 反映早期重農輕商的思想。
292. 清明無轉厝,無祖;過年無轉厝,無某 (Tshing-bîng bô tńg tshù, bô tsóo; kuè-nî bô tńg tshù, bô bóo) - 說明逢年過節在人民心中的重要性。
293. 七仔較興八仔 (Tshit-á khah hìng peh-á) - 形容兩人都有興致。
294. 七月半鴨仔,毋知死活 (Tshit-gue̍h-puànn a̍h-á, m̄ tsai sí-ua̍h) - 形容人沒有憂患意識,不知大難臨頭。
295. 七坐八爬九發牙 (Tshit tsē peh pê káu huat-gê) - 指嬰兒成長有一定的程序。
296. 手曲、屈入無屈出 (Tshiú-khiau, khut-ji̍p bô khut-tshut) - 比喻人都比較會袒護自己人,不會幫外人。
297. 手抱孩兒,才知爸母時 (Tshiú phō hâi-jî, tsiah tsai pē-bú sî) - 勸人要感念父母的養育之恩,孝順父母。
298. 樹頭待予在、毋驚樹尾做風颱 (Tshiū-thâu khiā hōo tsāi, m̄ kiann tshiū-bué tsò-hong-thai) - 指人行事正直無私,不怕任何的惡意中傷。
299. 喙飽目枵 (Tshuì pá ba̍k-tsiu iau) - 比喻為一個人貪得無厭。
300. 喙食,予尻川坐數 (Tshuì tsia̍h, hōo kha-tshng tshē-siàu) - 比喻貪圖一時的好處,自己得承受後果。
301. 喙脣皮相款待 (Tshuì-tûn-phuê sio khuán-thāi) - 比喻人只是口頭上敷衍,並非真心幫助。
302. 春雺曝死鬼,夏雺做大水 (Tshun bông pha̍k-sí kuí, hā bông tsò-tuā-tsuí) - 春天早晨若大霧籠罩,霧氣一旦散開後就會是個大晴天。
303. 春天後母面,欲變一時間 (Tshun-thinn āu-bú-bīn, beh piàn tsi̍t-sî-kan) - 以人前人後表現截然不同的繼母形容春季的天氣多變。
304. 食米毋知米價 (Tsia̍h bí m̄ tsai bí kè) - 形容只知享受,不知生活疾苦的人。
305. 食無三把蕹菜,就欲上西天 (Tsia̍h bô sann pé ìng-tshài, tō beh tsiūnn se-thian) - 諷刺人不肯腳踏實地,妄想一步登天。
306. 食魚食肉,也著菜佮 (Tsia̍h hî tsia̍h bah, iā tio̍h tshài kah) - 表示飲食要均衡身體才會健康。
307. 食好鬥相報 (Tsia̍h hó tàu sio-pò) - 引申為若有好東西,大家會口耳相傳。
308. 食雞,會起家:食魷魚,生囡仔好育飼 (Tsia̍h ke, ē khí-ke; tsia̍h jiû-hî, senn gín-á hó io-tshī) - 借諧音的吉祥話,說出心中的祝福。
309. 食緊弄破碗 (Tsia̍h-kín lòng-phuà uánn) - 比喻人做事情若只一心求快,反而容易造成反效果。
310. 食果子拜樹頭;食米飯拜田頭 (Tsia̍h kué-tsí pài tshiū-thâu; tsia̍h bí-pn̄g pài tshân-thâu) - 指人要懂得感恩,飲水思源,不可忘本。
311. 食人頭鍾酒,講人頭句話 (Tsia̍h lâng thâu tsing tsiú, kóng lâng thâu kù uē) - 講話者常用此句作為開場白表示僭越、自謙之意。
312. 食人一口,報人一斗 (Tsia̍h lâng tsi̍t kháu, pò lâng tsi̍t táu) - 意為受人恩惠時要感恩圖報,並加倍奉還。
313. 食人一斤,也著還人四兩 (Tsia̍h lâng tsi̍t kin, iā tio̍h hîng lâng sì niú) - 比喻知恩圖報。
314. 食飽換枵 (Tsia̍h-pá uānn iau) - 形容人徒勞無功,做沒有實質好處的事情。
315. 食飯皇帝大 (Tsia̍h-pn̄g hông-tè tuā) - 意為吃飯最重要,不管什麼事都不得干擾。
316. 食甜食鹹,臭跤鼻粘 (Tsia̍h tinn tsia̍h kiâm, tshàu kha-phīnn-liâm) - 用來勸誡人飲食要有節度。
317. 食著藥,青草一葉;食毋著藥、人參一石 (Tsia̍h tio̍h io̍h, tshenn-tsháu tsi̍t hio̍h; tsia̍h m̄-tio̍h io̍h, jîn-sim tsi̍t tsio̍h) - 比喻做事要能切中要點、掌握關鍵。
318. 食碗內,說碗外 (Tsia̍h uánn-lāi, sueh uánn-guā) - 暗諷人吃裡扒外,不知感恩。
319. 捷罵袂聽,捷拍袂疼 (Tsiap mē bē thiann, tsiap phah bē thiànn) - 意為頻繁的打罵教育,其懲罰效果就會愈來愈低。
320. 盡人事,順天意 (Tsīn jîn-sū, sūn thinn-ì) - 意即盡人事,聽天命。
321. 錢四跤,人兩跤 (Tsînn sì kha, lâng nn̄g kha) - 比喻賺錢的辛苦與不易。
322. 這溪無魚,別溪釣 (Tsit khe bô hî, pa̍t khe tiò) - 比喻某處無法謀生時,可到別處另尋出路。
323. 一面抹壁雙面光 (Tsi̍t bīn buah-piah siang bīn kng) - 比喻為人處事圓融,兩方都不得罪。
324. 一某無人知,兩某相卸代 (Tsi̍t bóo bô lâng tsai, nn̄g bóo sio-sià-tāi) - 形容有妻有妾者家中常有爭執,受人嘲笑。
325. 一个某較好三个天公祖 (Tsi̍t ê bóo khah hó sann ê Thinn-kong-tsóo) - 引申為有一賢內助持家,勝過老天爺保佑。
326. 一个囡仔較鬧熱三个大人 (Tsi̍t ê gín-á khah lāu-jia̍t sann ê tuā-lâng) - 所以家裡有小孩子,氣氛會顯得熱鬧又活絡。
327. 一个人一款命 (Tsi̍t ê lâng tsi̍t khuán miā) - 每個人的命運、際遇各不相同,不用怨天尤人。
328. 一个錢拍二十四个結 (Tsi̍t ê tsînn phah jī-tsa̍p-sì ê kat) - 譏諷人吝於用錢,視財如命。
329. 一耳空入,一耳空出 (Tsi̍t hīnn-khang ji̍p, tsi̍t hīnn-khang tshut) - 比喻不用心或者善忘。
330. 一鄉一俗 (Tsi̍t hiong tsi̍t sio̍k) - 指各地有不同的風俗習慣。
331. 一分錢,一分貨 (Tsi̍t hun tsînn, tsi̍t hun huè) - 花多少錢,就得到價值相當的東西。
332. 一樣米飼百樣人 (Tsi̍t iūnn bí tshī pah iūnn lâng) - 比喻這個社會上有著各式各樣、形形色色的人。
333. 一日徙栽,三日徛黃 (Tsi̍t ji̍t suá-tsai, sann ji̍t khiā-n̂g) - 勉勵做人做事要有定性,老是見異思遷則有害無利。
334. 一日剃頭,三日緣投 (Tsi̍t ji̍t thì thâu, sann ji̍t iân-tâu) - 理髮後會使人看起來清爽有神。
335. 一日討海,三日曝網 (Tsi̍t ji̍t thó-hái, sann ji̍t pha̍k bāng) - 比喻一曝十寒。
336. 一日走拋拋,一暝點燈膋 (Tsi̍t ji̍t tsáu-pha-pha, tsi̍t mê tiám ting-lâ) - 形容人白天只顧著玩樂,夜裡才拚命趕工,比喻本末倒置。
337. 一枝草,一點露 (Tsi̍t ki tsháu, tsi̍t tiám lōo) - 比喻天無絕人之路,只要努力,自有生路。
338. 一句話三角六尖 (Tsi̍t kù uē sann kak la̍k tsiam) - 指言語銳利,出言不遜、容易傷人。
339. 一人煩惱一樣,無人煩惱親像 (Tsi̍t lâng huân-ló tsi̍t iūnn, bô lâng huân-ló tshin-tshiūnn) - 意謂家家有本難念的經。
340. 一人看出一家,新婦看出大家 (Tsi̍t lâng khuànn-tshut tsi̍t ke, sin-pū khuànn-tshut ta-ke) - 亦即言教、身教對一個人有很大的影響。
341. 一人一家代,公媽隨人祀 (Tsi̍t lâng tsi̍t ke tāi, kong-má suî-lâng tshāi) - 用於勸人管好自己的事就好,不要管別人家閒事。
342. 一粒米,百粒汗 (Tsi̍t lia̍p bí, pah lia̍p kuānn) - 指農夫種田辛勞,糧食得來不易。
343. 一粒田螺煮九碗公湯 (Tsi̍t lia̍p tshân-lê tsú káu uánn-kong thng) - 形容生活貧苦,或比喻沒有真材實料。
344. 一暝全頭路,天光無半步 (Tsi̍t mê tsuân thâu-lōo, thinn-kng bô-puànn-pōo) - 形容人光說不練,只會紙上談兵。
345. 一年換二十四个頭家 (Tsi̍t nî uānn jī-tsa̍p-sì ê thâu-ke) - 形容人做事沒有定性,無法專心學習。
346. 一遍賊,百世賊 (Tsi̍t piàn tsha̍t, pah sì tsha̍t) - 引申為做了見不得人的事而殃及後代子孫。
347. 一步棋,一步著 (Tsi̍t pōo kî, tsi̍t pōo tio̍h) - 意謂做事情要有計畫,深思熟慮。
348. 一斗較贏九石 (Tsi̍t táu khah iânn káu tsio̍h) - 喻重質不重量。

        loadModelsBtn.addEventListener("click", async () => {
            const apiKey = apiKeyInput.value.trim();
            const baseUrl = apiBaseUrlInput.value.trim() || "https://generativelanguage.googleapis.com";
            
            if (!apiKey) { showStatus("❌ 請先輸入 API Key", "error"); return; }

            modelSelect.innerHTML = "<option>正在連線查詢...</option>";
            loadModelsBtn.disabled = true;

            try {
                const response = await fetch(`${baseUrl}/v1beta/models?key=${apiKey}`);
                if (!response.ok) throw new Error(`連線錯誤 (${response.status})`);
                const data = await response.json();
                modelSelect.innerHTML = "";
                
                let validModels = data.models.filter(m => 
                    m.name.includes("gemini") && 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes("generateContent")
                );

                if (validModels.length === 0) {
                    modelSelect.innerHTML = "<option value=''>找不到可用的 Gemini 模型</option>";
                    return;
                }

                validModels.forEach(model => {
                    const modelId = model.name.replace("models/", ""); 
                    const option = document.createElement("option");
                    option.value = modelId;
                    option.text = `${model.displayName || modelId}`;
                    if (modelId.includes("flash")) option.selected = true;
                    modelSelect.appendChild(option);
                });
                showStatus("✅ 模型載入成功", "success");

            } catch (error) {
                console.error(error);
                modelSelect.innerHTML = "<option value=''>載入失敗</option>";
                showStatus(`❌ 模型載入失敗：${error.message}`, "error");
            } finally {
                loadModelsBtn.disabled = false;
            }
        });

            const baseUrl = apiBaseUrlInput.value.trim() || "https://generativelanguage.googleapis.com";
            const url = `${baseUrl}/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

            async function fetchWithRetry(url, payload, retries = 3) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            const errText = await response.text();
                            if (response.status === 503 && i < retries - 1) {
                                showStatus(`⚠️ 伺服器忙碌中 (503)，正在進行第 ${i + 1} 次自動重試...`, "loading");
                                await new Promise(r => setTimeout(r, 2000 * (i + 1))); 
                                continue;
                            }
                            throw new Error(`API 錯誤 (${response.status}): ${errText}`);
                        }
                        return await response.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                    }
                }
            }

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.7 }
                };

                const data = await fetchWithRetry(url, payload);
                
                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error("API 回傳格式異常或被安全過濾攔截。");
                }
                
                const text = data.candidates[0].content.parts[0].text;
                generatedContentRaw = text; 

                let htmlText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                htmlText = htmlText.replace(/## (.*?)\n/g, '<h3>$1</h3>');
                htmlText = htmlText.replace(/\n/g, '<br>');

                scriptOutput.innerHTML = htmlText;
                outputContainer.style.display = "block";
                showStatus("✅ 劇本生成成功！", "success");
                outputContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error(error);
                let errorMsg = error.message;
                if (errorMsg.includes("404")) errorMsg = "找不到模型 (404) 或 API URL 錯誤。";
                showStatus(`❌ 生成失敗：${errorMsg}`, "error");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = "🚀 立即生成劇本";
            }
        });

        function getFilename(extension) {
            const topic = document.getElementById('topic').value.trim();
            const safeTopic = topic.replace(/[\\/:*?"<>|]/g, "_");
            return safeTopic ? `${safeTopic}.${extension}` : `台語劇本.${extension}`;
        }

        window.exportToWord = function() {
            if (!generatedContentRaw) { showStatus("❌ 無內容可匯出", "error"); return; }
            const content = generatedContentRaw.replace(/\n/g, "<br>");
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export</title></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = getFilename("doc");
            fileDownload.click();
            document.body.removeChild(fileDownload);
        };

        window.exportToExcel = function() {
            if (!generatedContentRaw) { showStatus("❌ 無內容可匯出", "error"); return; }
            let tableContent = "<table>";
            const lines = generatedContentRaw.split('\n');
            lines.forEach(line => {
                if(line.includes('：') || line.includes(':')) {
                    const parts = line.split(/[:：]/, 2);
                    tableContent += `<tr><td>${parts[0]}</td><td>${parts[1] || ''}</td></tr>`;
                } else {
                    tableContent += `<tr><td>${line}</td><td></td></tr>`;
                }
            });
            tableContent += "</table>";
            const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>' + tableContent + '</body></html>';
            const blob = new Blob([template], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = getFilename("xls");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
